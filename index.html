<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--alum4k:head:start-->
    <title>Alum 工作台</title>
    <meta name="description" content="Alum 工作台：常用应用与项目的统一入口。" />
    <link rel="icon" href="/brand.svg" />
    <!--alum4k:head:end-->
  </head>
  <body style="margin:0">
    <div id="root">
      <!--alum4k:content:start-->
      <main id="boot-screen" role="status" style="min-height:100dvh;display:grid;place-items:center;background:#101415;color:#f3f5f7;font-family:'Segoe UI','Microsoft YaHei',sans-serif;text-align:center;padding:24px;box-sizing:border-box;">
        <div><p id="boot-message">正在加载网站…</p><button id="boot-retry" type="button" hidden style="border:1px solid #485255;border-radius:4px;background:#191e20;color:#f3f5f7;padding:10px 18px;cursor:pointer;">重新加载</button><noscript><p>请启用浏览器 JavaScript 后重新加载。</p></noscript></div>
      </main>
      <!--alum4k:content:end-->
    </div>
    <script>
      (function () {
        var screen = document.getElementById("boot-screen");
        var message = document.getElementById("boot-message");
        var button = document.getElementById("boot-retry");
        function problem(text) { if (screen && screen.isConnected) { message.textContent = text; button.hidden = false; screen.setAttribute("role", "alert"); } }
        if (button) button.onclick = function () { location.reload(); };
        function recover() {
          if (location.protocol === "file:") return false;
          try {
            var previous = Number(sessionStorage.getItem("alum4k:asset-retry") || 0);
            if (Date.now() - previous < 60000) return false;
            sessionStorage.setItem("alum4k:asset-retry", String(Date.now()));
          } catch (_) { return false; }
          location.reload(); return true;
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && ((target.tagName === "SCRIPT" && target.src) || (target.tagName === "LINK" && target.rel === "stylesheet"))) { if (!recover()) problem("页面加载失败，请重新加载。"); }
        }, true);
        window.addEventListener("vite:preloadError", function (event) { if (recover()) event.preventDefault(); });
        var timer = screen ? setTimeout(function () { problem("网络较慢，请稍候或重新加载。"); }, 20000) : 0;
        if (screen) {
          var observer = new MutationObserver(function () { if (!screen.isConnected) { clearTimeout(timer); observer.disconnect(); } });
          observer.observe(document.getElementById("root"), { childList: true });
        }
        if (location.protocol === "file:") { clearTimeout(timer); problem("请通过网站地址访问。"); }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
